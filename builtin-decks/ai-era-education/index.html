<!doctype html>

<meta charset="utf-8">

<title>AI 時代，教育真正要改變什麼？</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;700&display=swap">
<style>
/* 版面沿用「老師當導演」黑板舞台：上方 SVG 舞台、下方字幕與分段控制列 */
:root{
  --board:#23392f; --board-deep:#1a2b23; --frame:#6e4c31;
  --chalk:#efe9d8; --chalk-dim:#a9b3a6;
  --yellow:#f2c14e; --orange:#e8875b; --blue:#7fb6d9; --green:#8fd18a; --red:#e66a5c;
  --font-chalk:"LXGW WenKai TC","Kaiti TC","DFKai-SB","BiauKai",serif;
  --font-body:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;
  color-scheme:dark;
}
html,body{background:var(--board-deep);color:var(--chalk)}
body{margin:0;font-family:var(--font-body);padding-inline:16px;padding-block:20px 28px}
.wrap{max-width:1600px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
/* 舞台＋字幕：全螢幕時一起放大 */
.theater{display:flex;flex-direction:column;gap:12px;align-items:center}
.theater .caption{align-self:stretch}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px}
h1{font-family:var(--font-chalk);font-weight:700;font-size:clamp(1.5rem,3.2vw,2.1rem);margin:0;text-wrap:balance}
.sub{color:var(--chalk-dim);font-size:.95rem;margin:0}
.board{box-sizing:border-box;position:relative;border:14px solid var(--frame);border-radius:6px;background:var(--board);box-shadow:inset 0 0 60px rgba(0,0,0,.45);max-width:100%;
  /* 同時受寬度與高度限制：保留約 250px 給標題、字幕與控制列，維持 16:9 */
  width:min(100%, calc((100vh - 250px) * 16 / 9 + 28px));
  width:min(100%, calc((100dvh - 250px) * 16 / 9 + 28px));
  min-width:min(100%, 360px)}
.theater:fullscreen{background:var(--board-deep);justify-content:center;padding:2vh 2vw;box-sizing:border-box}
.theater:fullscreen .board{width:min(100%, calc((100vh - 7em) * 16 / 9 + 28px));cursor:pointer}
.theater:fullscreen .caption{text-align:center;font-size:clamp(1.1rem,2.4vw,1.8rem)}
@media (max-width:640px){.board{border-width:8px}}
/* 內嵌模式（?embed=1）：給研習互動版用 iframe 嵌入，只留舞台與字幕，播放由外層控制 */
html.embed body{padding:0;overflow:hidden}
html.embed header,html.embed .controls,html.embed .chapters,html.embed .works,html.embed .note{display:none}
html.embed .wrap{max-width:none;gap:0}
/* 全部以 vh 計算（含木框與字幕），不同螢幕上舞台位置等比例一致，講師標註才對得準 */
html.embed .theater{gap:1vh}
html.embed .board{width:min(100%, calc(89vh * 16 / 9));border-width:1.4vh}
html.embed .caption{font-size:2.6vh;line-height:1.4;min-height:3.8vh;text-align:center;padding:0 1vh;margin:0}
.board svg{display:block;width:100%;height:auto;aspect-ratio:16/9}
.caption{font-family:var(--font-chalk);font-size:clamp(1.05rem,2.2vw,1.45rem);line-height:1.5;min-height:2.3em;margin:0}
.caption b{color:var(--yellow);font-weight:700}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
button{font:inherit;font-size:.95rem;color:var(--chalk);background:transparent;border:1.5px solid var(--chalk-dim);border-radius:999px;padding:.4em 1em;cursor:pointer}
button:hover{border-color:var(--yellow);color:var(--yellow)}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
#play{min-width:5.5em;border-color:var(--yellow);color:var(--yellow)}
#scrub{flex:1 1 220px;min-width:0;accent-color:var(--yellow)}
#time{font-variant-numeric:tabular-nums;color:var(--chalk-dim);font-size:.9rem;min-width:6.5em;text-align:right}
.chapters{display:flex;flex-direction:column;gap:6px;padding:0;margin:0;list-style:none}
.chapters li{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.chapters .grp{font-family:var(--font-chalk);color:var(--chalk-dim);min-width:7.5em;font-size:.95rem}
.chapters button{font-size:.85rem;padding:.25em .8em;border-color:rgba(239,233,216,.25);color:var(--chalk-dim)}
.chapters button[aria-current="true"]{border-color:var(--yellow);color:var(--yellow)}
.note{color:var(--chalk-dim);font-size:.85rem;margin:0}
.works h2{font-family:var(--font-chalk);font-size:1.15rem;margin:0 0 6px;color:var(--yellow)}
.works ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px 16px}
.works li{min-width:0}
.works a{color:var(--chalk);text-decoration-color:var(--chalk-dim);text-underline-offset:3px}
.works a:hover{color:var(--yellow)}
.works span{display:block;color:var(--chalk-dim);font-size:.85rem}
.t-chalk{font-family:var(--font-chalk);fill:var(--chalk)}
.t-body{font-family:var(--font-body);fill:var(--chalk)}
@media (prefers-reduced-motion: reduce){ .board{box-shadow:none} }
</style>

<div class="wrap">
  <header>
    <h1>AI 時代，教育真正要改變什麼？</h1>
    <p class="sub">從世界到教室・十六段・可停在任一段解說</p>
  </header>
  <div class="theater" id="theater">
  <div class="board"><svg id="stage" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" role="img" aria-label="AI 時代教育改變的動畫解說"></svg></div>
  <p class="caption" id="caption" aria-live="polite"></p>
  </div>
  <div class="controls">
    <button id="prev" type="button" aria-label="上一段">上一段</button>
    <button id="play" type="button">播放</button>
    <button id="next" type="button" aria-label="下一段">下一段</button>
    <input id="scrub" type="range" min="0" max="223" step="0.05" value="0" aria-label="時間軸">
    <span id="time">0.0 / 223.0</span>
    <button id="fs" type="button" aria-label="全螢幕播放">全螢幕</button>
  </div>
  <ul class="chapters" id="chapters"></ul>
  <section class="works" aria-labelledby="works-h"><h2 id="works-h">延伸連結</h2><ul id="works"></ul></section>
  <p class="note">鍵盤：空白鍵播放／暫停，左右方向鍵切換段落，F 鍵全螢幕。畫面只由時間決定，可用 window.seek(t) 逐格輸出成影片。數據與案例出處標在各段畫面左下角；本案例為教學示範，不作跨校因果推論。</p>
</div>

<script>
// ===== 時間表（秒）：大綱與原簡報一致：開場→世界→台灣→學校→教師→學生→學生 AI 素養→結語 =====
const SEGS = [
  {len:10, grp:'開場',        name:'五站路線',   cap:'從<b>世界、台灣、學校、教師</b>一路走到<b>學生</b>，看 AI 時代的教育要改什麼。'},
  {len:13, grp:'開場',        name:'三個問題',   cap:'今天不教更多工具，先回答三題：<b>AI 能支援什麼、人要親自做什麼、什麼證據顯示學習</b>。'},
  {len:15, grp:'01 世界',     name:'教師先行',   cap:'愛沙尼亞、韓國、新加坡、荷蘭路徑不同，共識相同：<b>Teachers first</b>，科技不會自己改變教育。'},
  {len:14, grp:'01 世界',     name:'人機協作',   cap:'AI 可以取代、互補、增能；<b>越靠近判斷與責任，人的主導權越重要</b>。'},
  {len:14, grp:'02 台灣',     name:'進入日常',   cap:'AI 已經進入備課、教材與公文；但<b>效率資料不等於學習成效</b>。'},
  {len:13, grp:'02 台灣',     name:'效率到價值', cap:'下一步：把省下的時間，<b>重新投資到教學判斷與學生回饋</b>。'},
  {len:13, grp:'03 學校',     name:'錯誤迴圈',   cap:'買工具、辦研習、要求使用、缺乏支持——<b>帳號不等於推動策略</b>。'},
  {len:15, grp:'03 學校',     name:'支持系統',   cap:'<b>治理、能力、社群、證據</b>四層缺一不可；成熟度要看能不能持續修正。'},
  {len:13, grp:'04 教師',     name:'新增價值',   cap:'不需要為 AI 而 AI：<b>新增價值要大於成本與風險</b>才值得用。'},
  {len:15, grp:'04 教師',     name:'保留卸載擴張', cap:'形成中的能力<b>保留</b>、重複工作<b>卸載</b>、找反例與新觀點用 AI <b>擴張</b>。'},
  {len:15, grp:'05 學生',     name:'表現≠學習', cap:'有 AI 時練習表現大幅提升，<b>離開 AI 後卻未必更會</b>。'},
  {len:14, grp:'05 學生',     name:'學習證據',   cap:'評量要看歷程：<b>初始想法、使用歷程、判斷理由、離開 AI 的表現</b>。'},
  {len:15, grp:'06 AI 素養',  name:'學習迴圈',   cap:'先嘗試、再用 AI、再查核、再修正，<b>每一輪讓 AI 退場一點</b>。'},
  {len:15, grp:'06 AI 素養',  name:'獨角仙復育', cap:'不只秀成品：從遊戲困惑到 micro:bit 與復育日誌，<b>證據越完整越能說是學生學會</b>。'},
  {len:13, grp:'06 AI 素養',  name:'皮影戲創作', cap:'<b>學生負責故事與判斷</b>，AI 協助風格轉換、骨架與分鏡。'},
  {len:16, grp:'結語',        name:'三個帶走',   cap:'思考方向、判斷標準與最後責任，<b>仍應留在人身上</b>。'}
];
let acc=0; SEGS.forEach(s=>{s.a=acc;acc+=s.len;s.b=acc});
window.DURATION=acc;
window.SEGS=SEGS;

// ===== 純函數工具 =====
const clamp=(x,lo,hi)=>Math.min(hi,Math.max(lo,x));
const P=(t,a,b)=>clamp((t-a)/(b-a),0,1);
const ease=x=>1-Math.pow(1-x,3);
const back=x=>{const c=1.6;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const lerp=(a,b,x)=>a+(b-a)*x;
const typed=(s,x)=>{const a=[...s];return a.slice(0,Math.round(a.length*clamp(x,0,1))).join('')};
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function sceneOpacity(t,s,last){return Math.min(P(t,s.a,s.a+0.5), last?1:1-P(t,s.b-0.4,s.b))}

// ===== 圖形元件 =====
// txt(x,y,字串,{a:對齊,s:字級,f:顏色,o:透明度,w:粗體,c:字族})
function txt(x,y,s,o={}){
  return `<text x="${x}" y="${y}" text-anchor="${o.a||'start'}" class="${o.c||'t-chalk'}" style="font-size:${o.s||30}px;${o.w?'font-weight:700;':''}${o.f?`fill:${o.f}`:''}" opacity="${o.o??1}">${esc(s)}</text>`;
}
function head(u,kicker,title){
  return txt(80,70,kicker,{c:'t-body',s:22,f:'var(--chalk-dim)',o:ease(P(u,0.1,0.6))})
    +txt(80,128,typed(title,P(u,0.2,1.4)),{s:46,w:1});
}
function src(s,u,at=1){return txt(80,860,s,{c:'t-body',s:19,f:'var(--chalk-dim)',o:ease(P(u,at,at+0.6))})}
function person(x,y,label,color='var(--yellow)',o=1,s=1){
  return `<g transform="translate(${x} ${y}) scale(${s})" opacity="${o}">
    <circle cx="0" cy="-118" r="34" fill="var(--board)" stroke="var(--chalk)" stroke-width="5"/>
    <path d="M-12 -122 q4 -5 8 0 M8 -122 q4 -5 8 0" stroke="var(--chalk)" stroke-width="3" fill="none"/>
    <path d="M-8 -104 q8 7 16 0" stroke="var(--chalk)" stroke-width="3" fill="none"/>
    <path d="M-48 0 Q-48 -78 0 -80 Q48 -78 48 0 Z" fill="var(--board)" stroke="var(--chalk)" stroke-width="5"/>
    <rect x="-34" y="-60" width="68" height="26" rx="6" fill="${color}"/>
    <text x="0" y="-41" text-anchor="middle" class="t-body" style="font-size:17px;font-weight:700;fill:var(--board-deep)">${esc(label)}</text>
  </g>`;
}
function bot(x,y,color,label,o=1,s=1){
  return `<g transform="translate(${x} ${y}) scale(${s})" opacity="${o}">
    <line x1="0" y1="-62" x2="0" y2="-82" stroke="${color}" stroke-width="4"/>
    <circle cx="0" cy="-86" r="7" fill="${color}"/>
    <rect x="-46" y="-62" width="92" height="74" rx="18" fill="var(--board)" stroke="${color}" stroke-width="5"/>
    <circle cx="-16" cy="-28" r="7" fill="${color}"/><circle cx="16" cy="-28" r="7" fill="${color}"/>
    <path d="M-12 -8 q12 8 24 0" stroke="${color}" stroke-width="3.5" fill="none"/>
    ${label?`<text x="0" y="44" text-anchor="middle" class="t-chalk" style="font-size:26px;fill:${color}">${esc(label)}</text>`:''}
  </g>`;
}
function stamp(x,y,text,color,o,s,w=300,rot=-8){
  return `<g transform="translate(${x} ${y}) rotate(${rot}) scale(${s})" opacity="${o}">
    <rect x="${-w/2}" y="-40" width="${w}" height="80" rx="10" fill="var(--board)" stroke="${color}" stroke-width="6"/>
    <text x="0" y="14" text-anchor="middle" class="t-chalk" style="font-size:40px;font-weight:700;fill:${color}">${esc(text)}</text>
  </g>`;
}
const stampIn=(u,a)=>{const k=P(u,a,a+0.6);return [k,lerp(1.6,1,ease(k))]};
function box(x,y,w,h,color,o=1,fill='rgba(239,233,216,.05)'){
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="12" fill="${fill}" stroke="${color}" stroke-width="3" opacity="${o}"/>`;
}
function arrow(x1,y1,x2,y2,color,o=1){
  const a=Math.atan2(y2-y1,x2-x1), h=14;
  return `<g opacity="${o}"><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="4"/>
    <path d="M${x2} ${y2} L${x2-h*Math.cos(a-0.5)} ${y2-h*Math.sin(a-0.5)} M${x2} ${y2} L${x2-h*Math.cos(a+0.5)} ${y2-h*Math.sin(a+0.5)}" stroke="${color}" stroke-width="4" stroke-linecap="round"/></g>`;
}

// ===== 各段畫面（u＝本段經過秒數；每一格只由 u 決定）=====
function sOpen(u){
  let g=txt(800,250,typed('AI 時代，教育真正要改變什麼？',P(u,0.3,2.6)),{a:'middle',s:80,w:1});
  g+=txt(800,330,'從國際發展到台灣現場，從學校治理到學生 AI 素養',{a:'middle',s:32,f:'var(--chalk-dim)',c:'t-body',o:ease(P(u,2.6,3.4))});
  const N=[['世界','趨勢與共識'],['台灣','現況與案例'],['學校','治理與支持'],['教師','動機與專業'],['學生','素養與作品']];
  const d=ease(P(u,3.4,6));
  g+=`<line x1="240" y1="580" x2="${lerp(240,1360,d)}" y2="580" stroke="var(--chalk-dim)" stroke-width="4" stroke-dasharray="10 10"/>`;
  const pos=lerp(0,4,ease(P(u,6.5,9.3)));
  N.forEach((n,i)=>{
    const o=ease(P(u,3.6+i*0.45,4.2+i*0.45)), x=240+i*280, lit=u>6.5&&pos>=i-0.01;
    const c=lit?'var(--yellow)':'var(--chalk-dim)';
    g+=`<g opacity="${o}"><circle cx="${x}" cy="580" r="58" fill="var(--board)" stroke="${c}" stroke-width="5"/>
      ${txt(x,595,String(i+1),{a:'middle',s:44,w:1,f:c})}
      ${txt(x,690,n[0],{a:'middle',s:40,f:lit?'var(--yellow)':'var(--chalk)'})}
      ${txt(x,732,n[1],{a:'middle',s:22,c:'t-body',f:'var(--chalk-dim)'})}</g>`;
  });
  if(u>6.5) g+=`<path d="M${240+pos*280} 512 l-14 -24 h28 Z" fill="var(--yellow)"/>`;
  return g;
}
function sQuestions(u){
  let g=txt(800,120,'今天不教「更多工具」',{a:'middle',s:56,w:1,o:ease(P(u,0.2,1))});
  g+=txt(800,185,'先回答三個教育問題',{a:'middle',s:32,f:'var(--yellow)',o:ease(P(u,1,1.8))});
  const Q=[['AI 可以支援什麼？','哪些工作適合交給 AI，','真的能省時間或擴大視野？'],
           ['人必須親自完成什麼？','哪些思考太早外包，','學習就可能被拿走？'],
           ['什麼證據顯示學習？','作品變好時，怎麼知道','變好的是學生，不是 AI？']];
  Q.forEach((q,i)=>{
    const x=ease(P(u,2+i*1.6,2.8+i*1.6)), cx=100+i*480, cy=lerp(320,260,x);
    g+=`<g transform="translate(${cx} ${cy})" opacity="${x}">${box(0,0,440,400,i===1?'var(--yellow)':'var(--chalk)')}
      ${txt(40,110,'0'+(i+1),{s:80,w:1,f:'var(--yellow)'})}
      ${txt(40,200,q[0],{s:34,w:1})}
      ${txt(40,270,q[1],{c:'t-body',s:24,f:'var(--chalk-dim)'})}
      ${txt(40,310,q[2],{c:'t-body',s:24,f:'var(--chalk-dim)'})}</g>`;
  });
  g+=txt(800,770,'這三題，會貫穿整場',{a:'middle',s:40,f:'var(--yellow)',o:ease(P(u,8.5,9.5))});
  return g;
}
function sWorld(u){
  let g=head(u,'01｜世界：國際發展','路徑不同，共識相同：教師先行');
  const cx=800, cy=520, r=170;
  const ring=ease(P(u,0.6,1.6)), glow=P(u,7.4,8.2);
  g+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="rgba(242,193,78,${0.08*glow})" stroke="var(--yellow)" stroke-width="${3+3*glow}" stroke-dasharray="12 10" opacity="${ring}"/>`;
  g+=person(cx,610,'教師','var(--yellow)',ring,1.1);
  g+=txt(cx,735,'教師專業',{a:'middle',s:32,f:'var(--yellow)',o:ring});
  const C=[['愛沙尼亞','Teachers first','教師 → PLC → 學校 → 學生',110,190],
           ['韓國','理解 → 應用 → 反思','教師是課程變革的主體',1090,190],
           ['新加坡','Pedagogical Layer','保留有價值的苦思',110,560],
           ['荷蘭','Human–AI 協作','互補、增能，不只自動化',1090,560]];
  C.forEach((c,i)=>{
    const o=ease(P(u,1.5+i*1.3,2.2+i*1.3));
    const ex=c[3]<800?c[3]+400:c[3], ey=c[4]+90;
    const dx=ex-cx, dy=ey-cy, L=Math.hypot(dx,dy), ln=ease(P(u,2+i*1.3,2.8+i*1.3));
    const rx=cx+dx/L*r, ry=cy+dy/L*r;
    g+=`<line x1="${ex}" y1="${ey}" x2="${lerp(ex,rx,ln)}" y2="${lerp(ey,ry,ln)}" stroke="var(--chalk-dim)" stroke-width="3" stroke-dasharray="8 8" opacity="${o}"/>`;
    g+=`<g transform="translate(${c[3]} ${c[4]})" opacity="${o}">${box(0,0,400,180,'var(--chalk)',1,'var(--board)')}
      ${txt(30,58,c[0],{s:38,w:1,f:'var(--yellow)'})}
      ${txt(30,108,c[1],{s:28})}
      ${txt(30,150,c[2],{c:'t-body',s:22,f:'var(--chalk-dim)'})}</g>`;
  });

playBtn.onclick=()=>{if(poster){poster=false;cur=0}playing?pause():play()};
scrub.oninput=()=>{poster=false;pause();show(parseFloat(scrub.value))};
document.getElementById('prev').onclick=()=>{poster=false;pause();const i=segIndex(cur-0.6);show(SEGS[i].a)};
document.getElementById('next').onclick=()=>{poster=false;pause();const i=segIndex(cur)+1;show(i<SEGS.length?SEGS[i].a:window.DURATION)};
document.addEventListener('keydown',e=>{
  if(document.documentElement.classList.contains('embed'))return;
  if(e.target.tagName==='INPUT'&&e.key!==' ')return;
  if(e.key===' '&&e.target.tagName==='BUTTON'&&e.target!==playBtn)return;
  if(e.key===' '){e.preventDefault();playBtn.click()}
  else if(e.key==='ArrowRight'){document.getElementById('next').click()}
  else if(e.key==='ArrowLeft'){document.getElementById('prev').click()}
  else if(e.key==='f'||e.key==='F'){toggleFs()}
});
// 全螢幕：舞台＋字幕一起放大；全螢幕中點畫面＝播放／暫停
const theater=document.getElementById('theater'), fsBtn=document.getElementById('fs');
function toggleFs(){
  if(document.fullscreenElement) document.exitFullscreen();
  else if(theater.requestFullscreen) theater.requestFullscreen().catch(()=>{});
}
fsBtn.onclick=toggleFs;
if(!theater.requestFullscreen) fsBtn.hidden=true;
document.addEventListener('fullscreenchange',()=>{fsBtn.textContent=document.fullscreenElement?'離開全螢幕':'全螢幕'});
theater.addEventListener('click',()=>{if(document.fullscreenElement) playBtn.click()});

// 開啟時停在開場完成的畫面，按播放從頭開始
// 網址可帶 ?t=秒數 直接停在某一格（方便上課分享或截圖）
const qt=parseFloat(new URLSearchParams(location.search).get('t'));
if(Number.isFinite(qt)){poster=false;show(qt)}else show(9.6);
window.ready.then(()=>show(cur));
// 契約 v1：postMessage 介面（研習互動版以 iframe 嵌入時由外層送 seek；獨立開啟時不啟用，不影響原播放）
addEventListener('message',(e)=>{
  if(e.source!==window.parent||window.parent===window)return;
  const m=e.data;
  if(!m||m.ptt!==1||m.type!=='seek'||typeof m.t!=='number'||!Number.isFinite(m.t))return;
  window.seek(m.t);
});
if(window.parent!==window)window.ready.then(()=>parent.postMessage({ptt:1,type:'ready',duration:window.DURATION},'*'));
